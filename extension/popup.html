<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>CaptionDuet</h1>
    <label class="switch" data-i18n-title="toggle">
      <input type="checkbox" id="enabled" data-i18n-label="toggle">
      <span></span>
    </label>
  </header>

  <main id="controls">
    <label class="field">
      <span data-i18n="top"></span>
      <select id="primary"></select>
    </label>

    <label class="field">
      <span data-i18n="bottom"></span>
      <select id="secondary"></select>
    </label>

    <!-- Only shown when there is something the viewer should know. -->
    <p class="notice" id="notice" hidden></p>

    <details id="more">
      <summary data-i18n="settings"></summary>

      <label class="field">
        <span><span data-i18n="size"></span> <output id="fontScaleOut"></output></span>
        <input type="range" id="fontScale" min="2.5" max="7" step="0.1">
      </label>

      <label class="field">
        <span><span data-i18n="background"></span> <output id="backgroundOut"></output></span>
        <input type="range" id="background" min="0" max="1" step="0.05">
      </label>

      <label class="field row">
        <span data-i18n="color"></span>
        <input type="color" id="secondaryColor">
      </label>

      <label class="field">
        <span data-i18n="uiLanguage"></span>
        <select id="uiLang"></select>
      </label>

      <p class="tech" id="tech" hidden><span data-i18n="details"></span>: <span id="techText"></span></p>
    </details>
  </main>

  <script src="core.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>

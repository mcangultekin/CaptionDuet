<!doctype html>
<meta charset="utf-8">
<title>running…</title>
<!-- Runs the real popup against a stand-in extension API: one "tab" with a
     video, and a second tab whose messages must be ignored. -->
<div id="host"></div>
<pre id="out">running…</pre>
<script>
  (async () => {
    const out = [];
    let failed = 0;
    const check = (name, ok, detail = "") => {
      if (!ok) failed++;
      out.push(`${ok ? "ok  " : "FAIL"} ${name}${ok ? "" : "  " + detail}`);
    };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    // Lists any language that lacks a text English has, or leaves a {placeholder} out.
    const I18nComplete = () => {
      const { T, LANGS } = globalThis.CaptionDuetI18n;
      const holes = (s) => (s.match(/\{\w+\}/g) || []).sort().join();
      const bad = [];
      for (const [code] of LANGS) {
        for (const key of Object.keys(T.en)) {
          if (!T[code] || !(key in T[code])) bad.push(`${code}.${key} missing`);
          else if (holes(T[code][key]) !== holes(T.en[key])) bad.push(`${code}.${key} placeholders`);
        }
      }
      return bad.join("; ");
    };
    try {
      const html = await (await fetch("../extension/popup.html")).text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      doc.querySelectorAll("script,link").forEach((e) => e.remove());
      document.getElementById("host").innerHTML = doc.body.innerHTML;

      const saved = [];
      let changed = null;
      const push = (states) => changed({ cdStates: { newValue: states } }, "local");
      const tabState = {
        status: { key: "running", mode: "full", a: 10, b: 10, missing: "bottom" },
        tracks: [
          { code: "en", name: "İngilizce", auto: true },
          { code: "de", name: "Almanca", auto: false },
        ],
        translations: [
          { code: "ja", name: "Japonca" },
          { code: "tr", name: "Türkçe" },
        ],
      };
      const other = { status: { key: "noCaptions" }, tracks: [], translations: [], at: 99 };
      // Main view: only what the viewer needs. Settings panel: the technical line.
      const notice = () => ($("notice").hidden ? "(hidden)" : $("notice").textContent);
      const tech = () => ($("tech").hidden ? "(hidden)" : $("techText").textContent);
      // A saved language the video does not list, and a newer entry from another tab.
      const store = { secondary: "xx", cdStates: { MINE: { ...tabState, at: 1 }, OTHER: other } };
      window.chrome = {
        storage: {
          local: {
            get: async (d) => ({ ...d, ...store }),
            set: async (patch) => saved.push(patch),
          },
          onChanged: { addListener: (fn) => (changed = fn) },
        },
        tabs: { query: async () => [{ id: 7, url: "https://www.youtube.com/watch?v=MINE" }] },
      };
      for (const src of ["../extension/core.js", "../extension/i18n.js", "../extension/popup.js"]) {
        await new Promise((ok, bad) => {
          const s = document.createElement("script");
          s.src = src;
          s.onload = ok;
          s.onerror = bad;
          document.body.appendChild(s);
        });
      }
      await wait(200);

      const $ = (id) => document.getElementById(id);
      const groups = (id) => [...$(id).querySelectorAll("optgroup")].map((g) => g.label + ": " + [...g.children].map((o) => o.textContent).join(", "));
      check("status is this tab's video, not the newest entry", notice() === "Bottom language not found.", notice());
      check("technical details live in the settings panel", tech() === "Working (full mode): 10 + 10 lines." && $("tech").closest("details") === $("more"), tech());
      check("settings are folded away by default", !$("more").open && $("fontScale").closest("details") === $("more") && $("uiLang").closest("details") === $("more"));
      check("the interface is English by default", $("uiLang").value === "en" && document.querySelector('[data-i18n="top"]').textContent === "Top subtitle" && $("primary").options[0].textContent === "The video's own language");
      check("lists the video's own tracks, then translations", JSON.stringify(groups("primary")) === JSON.stringify(["Subtitles in this video: İngilizce (auto-generated), Almanca", "Automatic translation: Japonca, Türkçe"]), JSON.stringify(groups("primary")));
      check("fixed choices stay first", $("secondary").options[0].value === "off" && $("secondary").options[1].value === "auto" && $("primary").options[0].value === "auto");
      check("defaults are selected", $("primary").value === "auto" && $("enabled").checked === true);
      check("an unlisted saved language still shows as selected", $("secondary").value === "xx");

      $("secondary").value = "ja";
      $("secondary").dispatchEvent(new Event("change"));
      check("choosing a language saves it", JSON.stringify(saved) === '[{"secondary":"ja"}]', JSON.stringify(saved));
      check("every interface language has every text", I18nComplete() === "", I18nComplete());

      push({ MINE: { ...tabState, at: 1 }, OTHER: { ...other, status: { key: "off" }, at: 100 } });
      check("another tab's update is ignored", notice() === "Bottom language not found.", notice());
      push({ MINE: { ...tabState, status: { key: "running", mode: "full", a: 10, b: 10, missing: "" }, at: 2 }, OTHER: other });
      check("nothing to say while subtitles are showing", notice() === "(hidden)" && tech() === "Working (full mode): 10 + 10 lines.", notice() + " / " + tech());
      push({ MINE: { ...tabState, status: { key: "downloadFailed", mode: "fallback", token: false }, at: 2 }, OTHER: other });
      check("a failure is plain in the main view, technical in the details", notice() === "Couldn't download the subtitles." && tech() === "fallback mode · token: missing", notice() + " / " + tech());
      push({ MINE: { ...tabState, status: { key: "waitingAd" }, at: 2 }, OTHER: other });
      check("this tab's updates are shown", notice() === "Waiting for the ad to finish…" && tech() === "(hidden)", notice() + " / " + tech());

      // Switching the interface language re-words everything at once, status included.
      $("uiLang").value = "tr";
      $("uiLang").dispatchEvent(new Event("change"));
      check("language switch: labels", document.querySelector('[data-i18n="top"]').textContent === "Üst altyazı" && $("secondary").options[0].textContent === "Kapalı", document.querySelector('[data-i18n="top"]').textContent);
      check("language switch: status", notice() === "Reklamın bitmesi bekleniyor…", notice());
      check("language switch: saved", JSON.stringify(saved[saved.length - 1]) === '{"uiLang":"tr"}', JSON.stringify(saved));
      check("language switch keeps the chosen subtitle language", $("secondary").value === "ja", $("secondary").value);
      $("uiLang").value = "en";
      $("uiLang").dispatchEvent(new Event("change"));

      $("enabled").checked = false;
      $("enabled").dispatchEvent(new Event("change"));
      push({ MINE: { ...tabState, status: { key: "off" }, at: 4 }, OTHER: other });
      check("switched off: controls step back, no message", document.body.classList.contains("off") && notice() === "(hidden)", notice());
      $("enabled").checked = true;
      $("enabled").dispatchEvent(new Event("change"));
      check("a status update keeps the chosen language", $("secondary").value === "ja", $("secondary").value);
      push({ MINE: { status: { key: "noCaptions" }, tracks: [], translations: [], at: 3 } });
      check("without track data the built-in list is used", groups("primary").length === 1 && /^Automatic translation: English, Spanish/.test(groups("primary")[0]), JSON.stringify(groups("primary")).slice(0, 80));
    } catch (e) {
      failed++;
      out.push("CRASH " + (e && e.stack ? e.stack : e));
    }
    out.push(failed ? `${failed} failed` : "all passed");
    globalThis.testResult = { failed, text: out.join("\n") };
    document.getElementById("out").textContent = globalThis.testResult.text;
    document.title = failed ? "FAIL" : "PASS";
  })();
</script>
